name: Container images

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: containers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Check tag belongs to main
    if: github.event.created == true && github.event.deleted == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      eligible: ${{ steps.branch.outputs.eligible }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tagged commit is in main history
        id: branch
        shell: bash
        run: |
          git rev-parse --verify refs/remotes/origin/main
          if git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "Tag skipped: its commit is not in main history." >> "$GITHUB_STEP_SUMMARY"
          fi

  validate:
    name: Build and test
    needs: release
    if: needs.release.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore
        run: dotnet restore FlexyParse.slnx
      - name: Build with analyzers
        run: dotnet build FlexyParse.slnx -c Release --no-restore
      - name: Test .NET
        run: dotnet test FlexyParse.slnx -c Release --no-build --logger trx --results-directory TestResults
      - name: Test deployment and web UI
        run: node --test tests/docker-compose.test.cjs tests/web-ui.test.cjs

  images:
    name: Image (${{ matrix.variant }})
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            dockerfile: docker/Dockerfile
            suffix: ''
          - variant: gpu
            dockerfile: docker/Dockerfile.gpu
            suffix: '-gpu'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Resolve image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and labels
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
          provenance: mode=max
          sbom: true
